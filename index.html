<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IPTV Player - Alla länder</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
html,body{height:100%;overflow:hidden;margin:0;background:#0a0a12;color:#e5e7eb;font-family:Inter,system-ui}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2a40;border-radius:4px}
.toggle{width:44px;height:24px;background:#2a2a40;border-radius:999px;position:relative;cursor:pointer;transition:.2s}
.toggle.on{background:#7c3aed}
.toggle:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on:after{left:22px}
.badge{font-size:10px;padding:2px 6px;border-radius:999px;background:#1f1f30}
</style>
</head>
<body class="flex flex-col">
<header class="flex-shrink-0 h-14 flex items-center justify-between px-4 bg-[#11111c] border-b border-[#22223a]">
<div class="flex items-center gap-3"><span class="text-xl">📺</span><b>IPTV Kurdistan + World</b><span id="stats" class="text-xs opacity-60 ml-2">0 kanaler</span></div>
<div class="flex gap-2"><button id="exportFav" class="text-xs bg-[#1e1e33] px-3 py-1.5 rounded">⭐ Exportera favoriter</button><button id="exportM3U" class="text-xs bg-[#2a2250] px-3 py-1.5 rounded">💾 Exportera valda</button></div>
</header>
<div class="flex-1 flex overflow-hidden min-h-0 flex-col lg:flex-row">
<div id="leftPanel" class="w-full lg:w-[440px] flex flex-col bg-[#0f0f1a] border-r border-[#22223a] overflow-hidden order-2 lg:order-1">
<div class="p-3 border-b border-[#22223a] space-y-3 flex-shrink-0">
<details id="manageDetails" open class="bg-[#16162a] rounded-xl p-3">
<summary class="cursor-pointer font-semibold flex justify-between items-center">⚙️ Hantera spellistor <span id="manageSummary" class="text-xs opacity-60">0/13 aktiva • sparas auto</span></summary>
<div id="playlistManager" class="mt-3 space-y-2 max-h-[340px] overflow-y-auto pr-1"></div>
<div class="mt-3 flex flex-col gap-2">
<button id="loadBtn" class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 py-3 rounded-xl font-bold text-white">▶️ Ladda kanaler (0 valda)</button>
<div class="flex gap-2">
<button data-preset="kurd" class="flex-1 text-xs bg-[#1e1e33] py-2 rounded">☀️ Kurdistan endast</button>
<button data-preset="tr" class="flex-1 text-xs bg-[#1e1e33] py-2 rounded">🇹🇷 Turkiet endast</button>
<button data-preset="all" class="flex-1 text-xs bg-[#1e1e33] py-2 rounded">Alla</button>
</div>
<label class="flex items-center gap-2 text-xs mt-1"><input type="checkbox" id="autoLoadCheck"/> Ladda mina valda automatiskt nästa gång</label>
</div>
</details>
<input id="search" placeholder="🔍 Sök kanal..." class="w-full bg-[#1a1a2e] rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-violet-600"/>
<div id="countryChips" class="flex flex-wrap gap-1.5"></div>
<div class="flex gap-2">
<select id="groupSelect" class="flex-1 bg-[#1a1a2e] rounded-lg px-2 py-2 text-xs"><option value="">Alla kategorier</option></select>
<select id="favFilter" class="bg-[#1a1a2e] rounded-lg px-2 py-2 text-xs"><option value="all">Alla kanaler</option><option value="fav">⭐ Favoriter</option></select>
</div>
</div>
<div id="channelList" class="flex-1 overflow-y-auto p-2 space-y-1">
<div class="text-center opacity-60 py-20 text-sm">👆 Välj spellistor och klicka <b>Ladda kanaler</b><br/>Dina val sparas automatiskt</div>
</div>
</div>
<div id="rightPanel" class="w-full lg:flex-1 bg-[#0a0a12] flex flex-col overflow-y-auto order-1 lg:order-2 lg:h-screen">
<div class="sticky top-0 z-20 bg-[#0a0a12] p-2 lg:p-3">
<div class="relative aspect-video bg-black rounded-xl overflow-hidden border border-[#22223a]">
<video id="video" controls autoplay class="w-full h-full"></video>
<div id="loadingOverlay" class="absolute inset-0 hidden items-center justify-center bg-black/70 text-sm">Laddar...</div>
</div>
</div>
<div class="p-3 lg:p-4 space-y-2">
<div class="flex items-start justify-between gap-2">
<div><div id="nowName" class="font-bold text-lg">Ingen kanal vald</div><div id="nowGroup" class="text-xs opacity-60"></div><div id="nowUrl" class="text-[10px] opacity-40 break-all mt-1"></div></div>
<button id="favBtn" class="text-2xl">☆</button>
</div>
<div class="flex gap-2 items-center"><button id="copyBtn" class="text-xs bg-[#1e1e33] px-3 py-1.5 rounded">📋 Kopiera länk</button><span id="toast" class="text-xs opacity-0 transition bg-violet-600 px-2 py-1 rounded">Sparad</span></div>
<div class="pt-2 border-t border-[#1a1a2e] space-y-2">
<details class="text-xs"><summary class="cursor-pointer opacity-70">➕ Lägg till egen M3U länk</summary><div class="mt-2 flex gap-2"><input id="customUrl" placeholder="https://..." class="flex-1 bg-[#1a1a2e] rounded px-2 py-1"/><button id="addCustom" class="bg-violet-600 px-3 py-1 rounded">Lägg till</button></div></details>
<label class="text-xs bg-[#1a1a2e] px-3 py-1.5 rounded cursor-pointer inline-block">📁 Ladda upp .m3u fil<input id="fileInput" type="file" accept=".m3u,.m3u8" hidden/></label>
<div class="text-[10px] opacity-40">Spelaren är alltid synlig när du scrollar kanallistan. Dina val sparas i webbläsaren.</div>
</div>
</div>
</div>
</div>
</div>
<script>
const PLAYLISTS = [
 {id:'movies', name:'Filmer', country:'Internationell', flag:'🎬', url:'https://iptv-org.github.io/iptv/categories/movies.m3u'},
 {id:'series', name:'Serier', country:'Internationell', flag:'📺', url:'https://iptv-org.github.io/iptv/categories/series.m3u'},
 {id:'kids', name:'Barn', country:'Internationell', flag:'🧒', url:'https://iptv-org.github.io/iptv/categories/kids.m3u'},
 {id:'kurdistan', name:'Kurdistan IPTV', country:'Kurdistan', flag:'☀️', url:'https://raw.githubusercontent.com/kurdishiptvchannels/KURDISTANIPTV/refs/heads/main/KURDISTAN%20IPTV.m3u'},
 {id:'sdh', name:'Södra Kurdiska', country:'Kurdistan', flag:'☀️', url:'https://iptv-org.github.io/iptv/languages/sdh.m3u'},
 {id:'iran', name:'Iran', country:'Iran', flag:'🇮🇷', url:'https://iptv-org.github.io/iptv/countries/ir.m3u'},
 {id:'enigma', name:'Enigma - Kurdish', country:'Kurdistan', flag:'☀️', url:'https://raw.githubusercontent.com/Enigma402/Iptv/refs/heads/main/2.m3u'},
 {id:'us', name:'USA', country:'USA', flag:'🇺🇸', url:'https://iptv-org.github.io/iptv/countries/us.m3u'},
 {id:'uk', name:'UK', country:'UK', flag:'🇬🇧', url:'https://iptv-org.github.io/iptv/countries/uk.m3u'},
 {id:'au', name:'Australien', country:'Australien', flag:'🇦🇺', url:'https://iptv-org.github.io/iptv/countries/au.m3u'},
 {id:'turk1', name:'Turkiet - ilyswch', country:'Turkiet', flag:'🇹🇷', url:'https://raw.githubusercontent.com/ilyswch/turk-iptv/main/index.m3u'},
 {id:'turk2', name:'Turkiet - Uzun', country:'Turkiet', flag:'🇹🇷', url:'https://streams.uzunmuhalefet.com/lists/tr.m3u'},
 {id:'ukgeo', name:'UK - Geo (ungeouk)', country:'UK', flag:'🇬🇧', url:'https://tinyurl.com/ungeouk'},
];
let active = new Set(JSON.parse(localStorage.getItem('iptv_active_playlists')||'[]'));
let removed = new Set(JSON.parse(localStorage.getItem('iptv_removed_playlists')||'[]'));
let favs = new Set(JSON.parse(localStorage.getItem('iptv_favorites')||'[]'));
let channelsByPlaylist = {};
let loaded = new Set();
let currentFilterCountry = 'Alla';
let searchQ = '';
let groupF = '';
let showFavOnly = false;
let currentChannel = null;
let hls = null;
if(active.size===0){ PLAYLISTS.forEach(p=>{ if(!removed.has(p.id)) active.add(p.id); }); }

function save(){
 localStorage.setItem('iptv_active_playlists', JSON.stringify([...active]));
 localStorage.setItem('iptv_removed_playlists', JSON.stringify([...removed]));
 localStorage.setItem('iptv_favorites', JSON.stringify([...favs]));
 updateSummary();
}
function updateSummary(){
 const total = PLAYLISTS.filter(p=>!removed.has(p.id)).length;
 document.getElementById('manageSummary').textContent = `${active.size}/${total} aktiva • sparas auto`;
 document.getElementById('loadBtn').textContent = `▶️ Ladda kanaler (${active.size} valda)`;
 document.getElementById('stats').textContent = `${getAllActiveChannels().length} kanaler • ${loaded.size} listor laddade`;
}
function getAllActiveChannels(){
 let arr=[];
 for(let id of active){ if(channelsByPlaylist[id]) arr = arr.concat(channelsByPlaylist[id]); }
 return arr;
}
const proxies = [u=>u, u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`, u=>`https://corsproxy.io/?${encodeURIComponent(u)}`, u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`];
async function fetchM3U(url){
 for(let p of proxies){
  try{
   const r = await fetch(p(url), {cache:'no-store'});
   if(!r.ok) continue;
   const t = await r.text();
   if(t && t.includes('#EXT')) return t;
  }catch(e){}
 }
 throw new Error('Kunde inte ladda '+url);
}
function parseM3U(text, playlistId){
 const lines = text.split('\n');
 const out=[]; let cur=null;
 for(let line of lines){
  line=line.trim();
  if(line.startsWith('#EXTINF')){
   const nameMatch = line.split(',').slice(1).join(',').trim() || 'Okänd';
   const logo = (line.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
   const group = (line.match(/group-title="([^"]*)"/)||[])[1]||'';
   cur={name:nameMatch, logo, group, playlistId, url:''};
  }else if(line && !line.startsWith('#') && cur){
   cur.url=line;
   const pl = PLAYLISTS.find(p=>p.id===playlistId);
   cur.country = pl?pl.country:''; cur.flag = pl?pl.flag:'';
   out.push(cur); cur=null;
  }
 }
 return out;
}
async function loadPlaylist(id){
 if(loaded.has(id) && channelsByPlaylist[id]) return channelsByPlaylist[id];
 const pl = PLAYLISTS.find(p=>p.id===id);
 if(!pl) return [];
 try{
  setRowStatus(id,'Laddar...','loading');
  const txt = await fetchM3U(pl.url);
  const chans = parseM3U(txt, id);
  channelsByPlaylist[id]=chans; loaded.add(id);
  setRowStatus(id,`Laddad (${chans.length})`,'loaded');
  return chans;
 }catch(e){
  setRowStatus(id,'Misslyckades','error');
  return [];
 }
}
function setRowStatus(id, text, state){
 const el = document.querySelector(`[data-row="${id}"] .status`);
 if(el){ el.textContent=text; el.className='status text-[10px] px-1.5 py-0.5 rounded ' + (state==='loaded'?'bg-green-900 text-green-300':state==='loading'?'bg-yellow-900 text-yellow-300 animate-pulse':state==='error'?'bg-red-900 text-red-300':'bg-[#2a2a40]'); }
}
function renderManager(){
 const cont = document.getElementById('playlistManager');
 cont.innerHTML='';
 PLAYLISTS.forEach(p=>{
  if(removed.has(p.id)) return;
  const isActive = active.has(p.id);
  const isLoaded = loaded.has(p.id);
  const count = channelsByPlaylist[p.id]?.length || '';
  const row = document.createElement('div');
  row.dataset.row=p.id;
  row.className=`flex items-center justify-between gap-2 p-2 rounded-lg bg-[#1a1a2e] ${!isActive?'opacity-50':''}`;
  row.innerHTML=`<div class="flex items-center gap-2 flex-1 min-w-0"><span>${p.flag}</span><div class="flex-1 min-w-0"><div class="text-xs font-semibold truncate">${p.name}</div><div class="text-[10px] opacity-60">${p.country} • ${count?count+' kanaler':''}</div></div><span class="status text-[10px] px-1.5 py-0.5 rounded ${isLoaded?'bg-green-900 text-green-300':'bg-[#2a2a40]'}">${isLoaded?(count?`Laddad (${count})`:'Laddad'):'Ej laddad'}</span></div><div class="flex items-center gap-2"><div class="toggle ${isActive?'on':''}" data-toggle="${p.id}"></div><button class="text-xs opacity-60 hover:opacity-100" data-remove="${p.id}">✕</button></div>`;
  cont.appendChild(row);
 });
 cont.querySelectorAll('[data-toggle]').forEach(t=>{
  t.onclick=async ()=>{
   const id=t.dataset.toggle;
   if(active.has(id)){
     active.delete(id); t.classList.remove('on'); t.closest('[data-row]').classList.add('opacity-50');
     save(); rebuild(); showToast('Dold från sök - avbockad');
   }else{
     active.add(id); t.classList.add('on'); t.closest('[data-row]').classList.remove('opacity-50');
     save();
     if(!loaded.has(id)){ showToast('Laddar ny spellista...'); await loadPlaylist(id); }
     rebuild(); showToast('Ny spellista tillagd och laddad');
   }
  };
 });
 cont.querySelectorAll('[data-remove]').forEach(b=>{
  b.onclick=()=>{ const id=b.dataset.remove; removed.add(id); active.delete(id); delete channelsByPlaylist[id]; loaded.delete(id); save(); renderManager(); rebuild(); showToast('Spellista borttagen'); };
 });
 updateSummary();
}
function rebuild(){
 const all = getAllActiveChannels();
 const groups = [...new Set(all.map(c=>c.group).filter(Boolean))].sort();
 const sel = document.getElementById('groupSelect');
 const curVal = sel.value;
 sel.innerHTML='<option value="">Alla kategorier</option>'+groups.map(g=>`<option>${g}</option>`).join('');
 sel.value=curVal;
 const chips = document.getElementById('countryChips');
 const uniqCountries = [...new Set(PLAYLISTS.filter(p=>active.has(p.id)).map(p=>p.country))];
 const countryData = uniqCountries.map(c=>{ const pl=PLAYLISTS.find(p=>p.country===c && active.has(p.id)); return {country:c, flag:pl?pl.flag:'', count: all.filter(ch=>ch.country===c).length}; });
 chips.innerHTML = `<button data-c="Alla" class="chip px-3 py-1 rounded-full text-xs ${currentFilterCountry==='Alla'?'bg-violet-600':'bg-[#1e1e33]'}">Alla (${all.length})</button>` + countryData.map(cd=>`<button data-c="${cd.country}" class="chip px-3 py-1 rounded-full text-xs ${currentFilterCountry===cd.country?'bg-violet-600':'bg-[#1e1e33]'}">${cd.flag} ${cd.country} (${cd.count})</button>`).join('');
 chips.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ currentFilterCountry=ch.dataset.c; rebuild(); });
 renderChannelList();
 updateSummary();
}
function renderChannelList(){
 const list = document.getElementById('channelList');
 let all = getAllActiveChannels();
 if(currentFilterCountry!=='Alla') all = all.filter(c=>c.country===currentFilterCountry);
 if(groupF) all = all.filter(c=>c.group===groupF);
 if(searchQ) all = all.filter(c=>c.name.toLowerCase().includes(searchQ.toLowerCase()));
 if(showFavOnly) all = all.filter(c=>favs.has(c.url));
 const seen=new Set(); all = all.filter(c=>{ if(seen.has(c.url)) return false; seen.add(c.url); return true; });
 if(all.length===0){ list.innerHTML=`<div class="text-center opacity-60 py-20 text-sm">Inga kanaler hittades<br/>Välj fler spellistor eller sök annat<br/><br/>Tips: Bocka i nya listor ovan - de laddas automatiskt</div>`; return; }
 list.innerHTML = all.slice(0,1000).map(c=>{
  const isFav = favs.has(c.url);
  return `<div class="channelRow flex items-center gap-2 p-2 rounded-lg hover:bg-[#1e1e33] cursor-pointer bg-[#151525]" data-url="${c.url.replace(/"/g,'&quot;')}"><img src="${c.logo}" onerror="this.style.display='none'" class="w-8 h-8 rounded bg-black object-contain flex-shrink-0"/><div class="flex-1 min-w-0"><div class="text-xs font-medium truncate">${c.name}</div><div class="text-[10px] opacity-60 flex gap-1"><span>${c.flag} ${c.country}</span><span class="badge">${c.group||'Allmän'}</span></div></div><button class="favStar text-lg" data-fav="${c.url.replace(/"/g,'&quot;')}">${isFav?'⭐':'☆'}</button></div>`;
 }).join('');
 list.querySelectorAll('.channelRow').forEach(row=>{
  row.onclick=(e)=>{ if(e.target.classList.contains('favStar')) return; const found=getAllActiveChannels().find(x=>x.url===row.dataset.url); playChannel(found); };
 });
 list.querySelectorAll('.favStar').forEach(b=>{
  b.onclick=(e)=>{ e.stopPropagation(); const u=b.dataset.fav; if(favs.has(u)) favs.delete(u); else favs.add(u); save(); b.textContent = favs.has(u)?'⭐':'☆'; if(showFavOnly) renderChannelList(); updateFavBtn(); showToast(favs.has(u)?'Tillagd i favoriter':'Borttagen'); };
 });
}
function playChannel(c){
 if(!c) return;
 currentChannel=c;
 document.getElementById('nowName').textContent=c.name;
 document.getElementById('nowGroup').textContent=`${c.flag} ${c.country} • ${c.group}`;
 document.getElementById('nowUrl').textContent=c.url;
 updateFavBtn();
 const video=document.getElementById('video');
 const overlay=document.getElementById('loadingOverlay');
 overlay.classList.remove('hidden'); overlay.classList.add('flex');
 if(hls){ hls.destroy(); hls=null; }
 if(c.url.endsWith('.m3u8') || c.url.includes('.m3u8')){
  if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>{ video.play(); overlay.classList.add('hidden'); overlay.classList.remove('flex'); }); }
  else if(video.canPlayType('application/vnd.apple.mpegurl')){ video.src=c.url; video.play(); overlay.classList.add('hidden'); }
 }else{ video.src=c.url; video.play(); video.onplaying=()=>{ overlay.classList.add('hidden'); overlay.classList.remove('flex'); }; }
}
function updateFavBtn(){
 const btn=document.getElementById('favBtn');
 if(!currentChannel){ btn.textContent='☆'; return; }
 btn.textContent = favs.has(currentChannel.url)?'⭐':'☆';
}
function showToast(msg){
 const t=document.getElementById('toast');
 t.textContent=msg; t.classList.remove('opacity-0'); t.classList.add('opacity-100');
 setTimeout(()=>{ t.classList.add('opacity-0'); t.classList.remove('opacity-100'); },2500);
}
document.getElementById('search').oninput=(e)=>{ searchQ=e.target.value; renderChannelList(); };
document.getElementById('groupSelect').onchange=(e)=>{ groupF=e.target.value; renderChannelList(); };
document.getElementById('favFilter').onchange=(e)=>{ showFavOnly=e.target.value==='fav'; renderChannelList(); };
document.getElementById('favBtn').onclick=()=>{ if(!currentChannel) return; if(favs.has(currentChannel.url)) favs.delete(currentChannel.url); else favs.add(currentChannel.url); save(); updateFavBtn(); renderChannelList(); showToast(favs.has(currentChannel.url)?'Tillagd i favoriter':'Borttagen'); };
document.getElementById('copyBtn').onclick=()=>{ if(currentChannel){ navigator.clipboard.writeText(currentChannel.url); showToast('Länk kopierad'); } };
document.getElementById('exportFav').onclick=()=>{ const chans = getAllActiveChannels().filter(c=>favs.has(c.url)); let m3u='#EXTM3U\n'; chans.forEach(c=>{ m3u+=`#EXTINF:-1 tvg-logo="${c.logo}" group-title="${c.group}",${c.name}\n${c.url}\n`; }); const blob=new Blob([m3u],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='favoriter.m3u'; a.click(); };
document.getElementById('exportM3U').onclick=()=>{ const chans = getAllActiveChannels(); let m3u='#EXTM3U\n'; chans.forEach(c=>{ m3u+=`#EXTINF:-1 tvg-logo="${c.logo}" group-title="${c.group}",${c.name}\n${c.url}\n`; }); const blob=new Blob([m3u],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='valda_spellistor.m3u'; a.click(); };
document.getElementById('loadBtn').onclick=async ()=>{
 const btn=document.getElementById('loadBtn');
 btn.disabled=true; const original=btn.textContent; btn.textContent='⏳ Laddar...';
 const ids = [...active];
 for(let i=0;i<ids.length;i++){ const id=ids[i]; btn.textContent=`Laddar ${i+1}/${ids.length}...`; if(!loaded.has(id)) await loadPlaylist(id); }
 btn.disabled=false; btn.textContent=original;
 rebuild(); showToast(`${getAllActiveChannels().length} kanaler laddade`);
};
document.querySelectorAll('[data-preset]').forEach(b=>{
 b.onclick=async ()=>{
  const p=b.dataset.preset;
  active.clear();
  if(p==='kurd') ['kurdistan','sdh','enigma'].forEach(id=>active.add(id));
  else if(p==='tr') ['turk1','turk2'].forEach(id=>active.add(id));
  else PLAYLISTS.forEach(pl=>{ if(!removed.has(pl.id)) active.add(pl.id); });
  save(); renderManager(); document.getElementById('loadBtn').click();
 };
});
document.getElementById('addCustom').onclick=async ()=>{
 const url=document.getElementById('customUrl').value.trim(); if(!url) return;
 const id='custom_'+Date.now(); PLAYLISTS.push({id, name:'Egen länk', country:'Egen', flag:'🔗', url}); active.add(id); save(); renderManager(); await loadPlaylist(id); rebuild();
};
document.getElementById('fileInput').onchange=async (e)=>{
 const file=e.target.files[0]; if(!file) return;
 const text=await file.text(); const chans=parseM3U(text,'file'); const id='file_'+Date.now();
 channelsByPlaylist[id]=chans; loaded.add(id); active.add(id);
 PLAYLISTS.push({id, name:file.name, country:'Fil', flag:'📁', url:''});
 save(); renderManager(); rebuild(); showToast(`${chans.length} kanaler från fil`);
};
document.getElementById('autoLoadCheck').onchange=(e)=>{ localStorage.setItem('iptv_autoload', e.target.checked?'1':'0'); };
document.getElementById('autoLoadCheck').checked = localStorage.getItem('iptv_autoload')==='1';
renderManager(); rebuild();
if(localStorage.getItem('iptv_autoload')==='1'){ document.getElementById('loadBtn').click(); }
function adjustMobile(){ if(window.innerWidth<1024){ document.getElementById('leftPanel').style.marginTop='56vw'; }else{ document.getElementById('leftPanel').style.marginTop='0'; } }
window.addEventListener('resize', adjustMobile); adjustMobile();
</script>
</body>
</html>
